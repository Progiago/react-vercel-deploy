name: Sync FoundFootage releases

on:
  schedule:
    # Verifica novas versões a cada 30 minutos.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-foundfootage-releases
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync releases and installer
        env:
          FOUNDFOOTAGE_TOKEN: ${{ secrets.FOUNDFOOTAGE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/sync-releases.mjs

      - name: Commit releases feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/releases.json
          if git diff --cached --quiet; then
            echo "Feed já está atualizado."
          else
            git commit -m "chore: sincroniza releases do FoundFootage"
            git push
          fi
